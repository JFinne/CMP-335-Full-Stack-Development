<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central Tendency Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <h1>Central Tendency Calculator</h1>
    <div class="flex-container">
        <div class="flexbox-column">
        <h2>Set Range</h2>
        <div>
            <div>
            <label for="low">Low Value</label>
            <input type="number" id="low" placeholder="e.g. 1" />
            </div>
            <div>
            <label for="high">High Value</label>
            <input type="number" id="high" placeholder="e.g. 100" />
            </div>
        </div>
        <button id="setRange">Set Range</button>
        </div>

        <div class="flexbox-column">
        <h2>Get Numbers</h2>
        <div>
            <input type="number" id="manualInput"placeholder="Enter a number" />
            <button id="addManual">Add Number</button>
        </div>
        </div>

        <div class="flexbox-column">
        <h2>Results</h2>
        <p><strong>Numbers:</strong> <span id="numbersList">None yet</span></p>
        <p><strong>Mean:</strong> <span id="mean">-</span></p>
        <p><strong>Median:</strong> <span id="median">-</span></p>
        <p><strong>Mode:</strong> <span id="mode">-</span></p>
        </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
